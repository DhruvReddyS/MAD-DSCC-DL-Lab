<script id="data" type="application/json">[{"id": "mad", "name": "MAD", "full": "Mobile Application Development", "intro": "Android programs in Java. Each set has the theory answer, MainActivity.java and AndroidManifest.xml.", "procedure": ["Open Android Studio → <b>New Project<\/b> → <b>Empty Views Activity<\/b> → Next.", "Name it anything, set <b>Language: Java<\/b>, Minimum SDK API 24 or higher → Finish.", "Open <code>app/java/&lt;your package&gt;/MainActivity.java<\/code>, delete everything and paste the given MainActivity.java. <b>Keep the first line<\/b> <code>package ...;<\/code> the same as your project's package.", "Open <code>app/manifests/AndroidManifest.xml<\/code> and add only the lines shown in <b>Manifest lines to add<\/b> (permissions go just above <code>&lt;application&gt;<\/code>; a <code>&lt;receiver&gt;<\/code> goes inside it). The full manifest is given for reference.", "No layout XML is needed: every program builds its screen in Java.", "Click <b>Run ▶<\/b> and pick an emulator. Allow the permission if a popup asks."], "programs": [{"id": "set1", "title": "Set 1 · GPS Location", "question": "Explain the role of GPS in Android. What steps and permissions are needed to get the current location? Write an app that shows the current location.", "aim": "To build an Android app that reads the device's current GPS location and shows latitude and longitude.", "theory": ["GPS (Global Positioning System) uses satellites to find the device's latitude, longitude and altitude. Apps use it for maps, navigation, delivery tracking and geo-tagging.", "Android gives location through <b>LocationManager<\/b> (system service <code>LOCATION_SERVICE<\/code>). Providers: <code>GPS_PROVIDER<\/code> (accurate, outdoors) and <code>NETWORK_PROVIDER<\/code> (Wi-Fi / cell towers).", "Permissions in the manifest: <code>ACCESS_FINE_LOCATION<\/code> (GPS, exact) and <code>ACCESS_COARSE_LOCATION<\/code> (approximate). From Android 6 they are <b>dangerous permissions<\/b>, so the app must also ask at run time with <code>requestPermissions()<\/code>.", "Steps: (1) declare permissions, (2) check / request permission, (3) get LocationManager, (4) call <code>requestLocationUpdates(provider, minTime, minDistance, listener)<\/code>.", "The activity implements <b>LocationListener<\/b>; <code>onLocationChanged(Location)<\/code> is called with each new fix, and <code>getLatitude()<\/code> / <code>getLongitude()<\/code> give the values.", "On the emulator, send a fake location from <b>Extended controls (⋯) → Location<\/b> to test the app."], "manifest_add": "<uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n<uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />", "files": [{"name": "MainActivity.java", "lang": "java", "code": "package com.example.gps;\n\nimport android.Manifest;\nimport android.content.pm.PackageManager;\nimport android.location.*;\nimport android.os.Bundle;\nimport android.widget.TextView;\nimport androidx.appcompat.app.AppCompatActivity;\n\npublic class MainActivity extends AppCompatActivity implements LocationListener {\n    TextView tv;\n\n    protected void onCreate(Bundle b) {\n        super.onCreate(b);\n        tv = new TextView(this);\n        tv.setTextSize(24); tv.setPadding(50, 150, 50, 50);\n        tv.setText(\"Getting location...\");\n        setContentView(tv);\n\n        if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED)\n            requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, 1);\n        else start();\n    }\n\n    public void onRequestPermissionsResult(int c, String[] p, int[] r) {\n        super.onRequestPermissionsResult(c, p, r);\n        if (r.length > 0 && r[0] == PackageManager.PERMISSION_GRANTED) start();\n    }\n\n    @SuppressWarnings(\"MissingPermission\")\n    void start() {\n        LocationManager lm = (LocationManager) getSystemService(LOCATION_SERVICE);\n        lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000, 0, this);\n    }\n\n    public void onLocationChanged(Location loc) {\n        tv.setText(\"Latitude: \" + loc.getLatitude() + \"\\nLongitude: \" + loc.getLongitude());\n    }\n}"}, {"name": "AndroidManifest.xml", "lang": "markup", "code": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n    <application\n        android:label=\"GPS Location\"\n        android:theme=\"@style/Theme.AppCompat.Light.DarkActionBar\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            <\/intent-filter>\n        <\/activity>\n    <\/application>\n<\/manifest>"}], "run": ["Follow the common steps at the top (Empty Views Activity, Java).", "Paste MainActivity.java (keep your own <code>package<\/code> line).", "Add the manifest lines shown below.", "Emulator: ⋯ (Extended controls) → Location → enter latitude/longitude → <b>Set Location<\/b>.", "Run ▶ on the emulator."], "output": {"text": "Emulator location set to 17.3850, 78.4867 (Extended controls > Location):\n\nLatitude: 17.385\nLongitude: 78.4867", "badge": "Tested on emulator"}}, {"id": "set2", "title": "Set 2 · Write to SD Card", "question": "Explain external storage in Android. How do you write data to the SD card and which permissions are needed? Write an app that writes data to the SD card.", "aim": "To build an Android app that writes user-entered text to a file on external storage (SD card) and reads it back.", "theory": ["<b>Internal storage<\/b> is private to the app; <b>external storage<\/b> (SD card / shared storage) is larger and can hold files like documents and media.", "<code>getExternalFilesDir(null)<\/code> returns the app's own folder on external storage: <code>/storage/emulated/0/Android/data/&lt;package&gt;/files<\/code>. It is removed when the app is uninstalled.", "Permission: <code>WRITE_EXTERNAL_STORAGE<\/code> was needed up to Android 9 (API 28). From Android 10 (scoped storage) the app's own external folder needs <b>no permission<\/b>, so we add it with <code>maxSdkVersion=\"28\"<\/code>.", "Before writing you can check that storage is mounted with <code>Environment.getExternalStorageState()<\/code>.", "Writing uses normal Java I/O: <code>FileWriter<\/code> / <code>FileOutputStream<\/code>. Reading uses <code>FileReader<\/code> + <code>BufferedReader<\/code>.", "In the app, the <b>Write<\/b> button saves the EditText text to <code>mydata.txt<\/code> and shows the path; the <b>Read<\/b> button reads it back."], "manifest_add": "<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"\n    android:maxSdkVersion=\"28\" />", "files": [{"name": "MainActivity.java", "lang": "java", "code": "package com.example.sdcard;\n\nimport android.os.Bundle;\nimport android.widget.*;\nimport androidx.appcompat.app.AppCompatActivity;\nimport java.io.*;\n\npublic class MainActivity extends AppCompatActivity {\n    protected void onCreate(Bundle b) {\n        super.onCreate(b);\n        LinearLayout l = new LinearLayout(this);\n        l.setOrientation(LinearLayout.VERTICAL);\n        l.setPadding(50, 150, 50, 50);\n\n        EditText data = new EditText(this); data.setHint(\"Enter data\");\n        Button write = new Button(this); write.setText(\"Write to SD Card\");\n        Button read = new Button(this); read.setText(\"Read from SD Card\");\n        TextView out = new TextView(this); out.setTextSize(20);\n        l.addView(data); l.addView(write); l.addView(read); l.addView(out);\n        setContentView(l);\n\n        File file = new File(getExternalFilesDir(null), \"mydata.txt\"); // SD card (external storage)\n\n        write.setOnClickListener(v -> {\n            try (FileWriter fw = new FileWriter(file)) {\n                fw.write(data.getText().toString());\n                out.setText(\"Saved to: \" + file.getAbsolutePath());\n            } catch (IOException e) { out.setText(\"Error: \" + e); }\n        });\n\n        read.setOnClickListener(v -> {\n            try (BufferedReader br = new BufferedReader(new FileReader(file))) {\n                out.setText(\"File data: \" + br.readLine());\n            } catch (IOException e) { out.setText(\"Error: \" + e); }\n        });\n    }\n}"}, {"name": "AndroidManifest.xml", "lang": "markup", "code": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"28\" />\n    <application\n        android:label=\"SD Card\"\n        android:theme=\"@style/Theme.AppCompat.Light.DarkActionBar\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            <\/intent-filter>\n        <\/activity>\n    <\/application>\n<\/manifest>"}], "run": ["Follow the common steps at the top (Empty Views Activity, Java).", "Paste MainActivity.java (keep your own <code>package<\/code> line).", "Add the manifest lines shown below.", "Run ▶ on the emulator."], "output": {"text": "Typed \"Hello SD Card\"\n\nWRITE TO SD CARD →\nSaved to: /storage/emulated/0/Android/data/com.example.sdcard/files/mydata.txt\n\nREAD FROM SD CARD →\nFile data: Hello SD Card", "badge": "Tested on emulator"}}, {"id": "set3", "title": "Set 3 · SMS Alert (Broadcast Receiver)", "question": "What is a Broadcast Receiver? Explain how an app receives a message and raises an alert. Write an app that shows an alert when an SMS arrives.", "aim": "To build an Android app that uses a BroadcastReceiver to detect an incoming SMS and show an alert dialog.", "theory": ["A <b>Broadcast Receiver<\/b> is an Android component that listens for system-wide messages (broadcasts) such as SMS received, battery low, boot completed or network change.", "We extend <code>BroadcastReceiver<\/code> and override <code>onReceive(Context, Intent)<\/code>; it runs when a matching broadcast arrives.", "Receivers are registered either in the manifest (static) or in code using <code>registerReceiver(receiver, IntentFilter)<\/code> (dynamic). Here it is registered in code for action <code>android.provider.Telephony.SMS_RECEIVED<\/code> and unregistered in <code>onDestroy()<\/code>.", "Permission: <code>RECEIVE_SMS<\/code> in the manifest and requested at run time.", "<code>Telephony.Sms.Intents.getMessagesFromIntent(intent)<\/code> gives <code>SmsMessage<\/code> objects; <code>getOriginatingAddress()<\/code> = sender, <code>getMessageBody()<\/code> = text.", "The alert is raised using <code>AlertDialog.Builder<\/code> with title (sender), message (SMS text) and an OK button."], "manifest_add": "<uses-permission android:name=\"android.permission.RECEIVE_SMS\" />", "files": [{"name": "MainActivity.java", "lang": "java", "code": "package com.example.smsalert;\n\nimport android.Manifest;\nimport android.app.AlertDialog;\nimport android.content.*;\nimport android.os.Bundle;\nimport android.provider.Telephony;\nimport android.telephony.SmsMessage;\nimport android.widget.TextView;\nimport androidx.appcompat.app.AppCompatActivity;\n\npublic class MainActivity extends AppCompatActivity {\n    BroadcastReceiver receiver = new BroadcastReceiver() {\n        public void onReceive(Context c, Intent i) {\n            for (SmsMessage m : Telephony.Sms.Intents.getMessagesFromIntent(i)) {\n                new AlertDialog.Builder(MainActivity.this)\n                        .setTitle(\"New Message from \" + m.getOriginatingAddress())\n                        .setMessage(m.getMessageBody())\n                        .setPositiveButton(\"OK\", null).show();\n            }\n        }\n    };\n\n    protected void onCreate(Bundle b) {\n        super.onCreate(b);\n        TextView tv = new TextView(this);\n        tv.setTextSize(22); tv.setPadding(50, 150, 50, 50);\n        tv.setText(\"Waiting for messages...\");\n        setContentView(tv);\n        requestPermissions(new String[]{Manifest.permission.RECEIVE_SMS}, 1);\n        registerReceiver(receiver, new IntentFilter(\"android.provider.Telephony.SMS_RECEIVED\"), RECEIVER_EXPORTED);\n    }\n\n    protected void onDestroy() {\n        super.onDestroy();\n        unregisterReceiver(receiver);\n    }\n}"}, {"name": "AndroidManifest.xml", "lang": "markup", "code": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.RECEIVE_SMS\" />\n    <application\n        android:label=\"SMS Alert\"\n        android:theme=\"@style/Theme.AppCompat.Light.DarkActionBar\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            <\/intent-filter>\n        <\/activity>\n    <\/application>\n<\/manifest>"}], "run": ["Follow the common steps at the top (Empty Views Activity, Java).", "Paste MainActivity.java (keep your own <code>package<\/code> line).", "Add the manifest lines shown below.", "Emulator: ⋯ (Extended controls) → Phone → enter a number and message → <b>Send Message<\/b>.", "Run ▶ on the emulator."], "output": {"text": "SMS sent from 9999 with text \"Hello\" (Extended controls > Phone):\n\nAlert dialog\n  Title  : New Message from 9999\n  Message: Hello\n  [ OK ]", "badge": "Tested on emulator"}}, {"id": "set4", "title": "Set 4 · RSS Feed Reader", "question": "What is an RSS feed? Explain how an Android app retrieves and displays RSS items. Write an RSS feed app.", "aim": "To build an Android app that downloads an RSS feed and shows the item titles in a list.", "theory": ["<b>RSS<\/b> (Really Simple Syndication) is an XML format websites use to publish updates. A feed has a <code>&lt;channel&gt;<\/code> with many <code>&lt;item&gt;<\/code>s, each with <code>&lt;title&gt;<\/code>, <code>&lt;link&gt;<\/code>, <code>&lt;description&gt;<\/code>, <code>&lt;pubDate&gt;<\/code>.", "Permission: <code>INTERNET<\/code>, because the feed is downloaded from a URL.", "Network work must run on a <b>background thread<\/b> (here <code>new Thread()<\/code>); doing it on the main thread throws <code>NetworkOnMainThreadException<\/code>.", "The XML is read with <b>XmlPullParser<\/b>: loop over events, and when a <code>START_TAG<\/code> named <code>title<\/code> appears inside an <code>item<\/code>, read it with <code>nextText()<\/code>.", "Titles are stored in an <code>ArrayList<\/code>; the UI is updated with <code>runOnUiThread()<\/code>.", "A <b>ListView<\/b> with an <b>ArrayAdapter<\/b> displays one title per row."], "manifest_add": "<uses-permission android:name=\"android.permission.INTERNET\" />", "files": [{"name": "MainActivity.java", "lang": "java", "code": "package com.example.rss;\n\nimport android.os.Bundle;\nimport android.widget.*;\nimport androidx.appcompat.app.AppCompatActivity;\nimport java.io.InputStream;\nimport java.net.URL;\nimport java.util.ArrayList;\nimport org.xmlpull.v1.*;\n\npublic class MainActivity extends AppCompatActivity {\n    ArrayList<String> titles = new ArrayList<>();\n\n    protected void onCreate(Bundle b) {\n        super.onCreate(b);\n        ListView lv = new ListView(this);\n        setContentView(lv);\n\n        new Thread(() -> {\n            try {\n                InputStream in = new URL(\"https://feeds.bbci.co.uk/news/rss.xml\").openStream();\n                XmlPullParser p = XmlPullParserFactory.newInstance().newPullParser();\n                p.setInput(in, null);\n                boolean inItem = false;\n                while (p.next() != XmlPullParser.END_DOCUMENT) {\n                    if (p.getEventType() == XmlPullParser.START_TAG) {\n                        if (p.getName().equals(\"item\")) inItem = true;\n                        else if (inItem && p.getName().equals(\"title\")) titles.add(p.nextText());\n                    }\n                }\n            } catch (Exception e) { titles.add(\"Error: \" + e.getMessage()); }\n            runOnUiThread(() -> lv.setAdapter(\n                    new ArrayAdapter<>(this, android.R.layout.simple_list_item_1, titles)));\n        }).start();\n    }\n}"}, {"name": "AndroidManifest.xml", "lang": "markup", "code": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application\n        android:label=\"RSS Feed\"\n        android:theme=\"@style/Theme.AppCompat.Light.DarkActionBar\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            <\/intent-filter>\n        <\/activity>\n    <\/application>\n<\/manifest>"}], "run": ["Follow the common steps at the top (Empty Views Activity, Java).", "Paste MainActivity.java (keep your own <code>package<\/code> line).", "Add the manifest lines shown below.", "Run ▶ on the emulator."], "output": {"text": "A scrolling list of the latest BBC News headlines (one title per row).", "badge": "Tested on emulator"}}, {"id": "set5", "title": "Set 5 · Send Email", "question": "Explain the steps to send an email from an Android app. Which intent is used? Write an app to send an email.", "aim": "To build an Android app that collects To, Subject and Message and sends an email through an installed mail app using an Intent.", "theory": ["Android apps send email by handing the job to an email app (Gmail, Outlook) using an <b>implicit Intent<\/b>; no password or SMTP code is needed.", "The intent action is <code>Intent.ACTION_SEND<\/code> (or <code>ACTION_SENDTO<\/code> with a <code>mailto:<\/code> URI).", "<code>setType(\"message/rfc822\")<\/code> marks the data as an email so only email apps respond.", "Data is added with extras: <code>EXTRA_EMAIL<\/code> (String array of addresses), <code>EXTRA_SUBJECT<\/code>, <code>EXTRA_TEXT<\/code> (body); optionally <code>EXTRA_CC<\/code>, <code>EXTRA_BCC<\/code>.", "<code>Intent.createChooser(intent, \"Send email using\")<\/code> lets the user pick the app; <code>startActivity()<\/code> launches it.", "No special permission is needed because the mail app does the actual sending."], "manifest_add": "(nothing to add - no permission needed)", "files": [{"name": "MainActivity.java", "lang": "java", "code": "package com.example.sendmail;\n\nimport android.content.Intent;\nimport android.os.Bundle;\nimport android.widget.*;\nimport androidx.appcompat.app.AppCompatActivity;\n\npublic class MainActivity extends AppCompatActivity {\n    protected void onCreate(Bundle b) {\n        super.onCreate(b);\n        LinearLayout l = new LinearLayout(this);\n        l.setOrientation(LinearLayout.VERTICAL);\n        l.setPadding(50, 150, 50, 50);\n\n        EditText to = new EditText(this); to.setHint(\"To\");\n        EditText sub = new EditText(this); sub.setHint(\"Subject\");\n        EditText msg = new EditText(this); msg.setHint(\"Message\");\n        Button send = new Button(this); send.setText(\"Send Email\");\n        l.addView(to); l.addView(sub); l.addView(msg); l.addView(send);\n        setContentView(l);\n\n        send.setOnClickListener(v -> {\n            Intent i = new Intent(Intent.ACTION_SEND);\n            i.setType(\"message/rfc822\");\n            i.putExtra(Intent.EXTRA_EMAIL, new String[]{to.getText().toString()});\n            i.putExtra(Intent.EXTRA_SUBJECT, sub.getText().toString());\n            i.putExtra(Intent.EXTRA_TEXT, msg.getText().toString());\n            startActivity(Intent.createChooser(i, \"Send email using\"));\n        });\n    }\n}"}, {"name": "AndroidManifest.xml", "lang": "markup", "code": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <application\n        android:label=\"Send Email\"\n        android:theme=\"@style/Theme.AppCompat.Light.DarkActionBar\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            <\/intent-filter>\n        <\/activity>\n    <\/application>\n<\/manifest>"}], "run": ["Follow the common steps at the top (Empty Views Activity, Java).", "Paste MainActivity.java (keep your own <code>package<\/code> line).", "Add the manifest lines shown below.", "Run ▶ on the emulator."], "output": {"text": "Tapping SEND EMAIL opens the \"Send email using\" chooser (Gmail etc.) with the message prefilled.\nChoosing Gmail opens compose with To, Subject and Message already filled.", "badge": "Tested on emulator"}}, {"id": "set6", "title": "Set 6 · Calculator", "question": "Explain the components and event handling of a native calculator app. Write a calculator app for + − × ÷.", "aim": "To build a simple Android calculator that adds, subtracts, multiplies and divides two numbers.", "theory": ["UI components: two <b>EditText<\/b>s for the numbers, four <b>Button<\/b>s (+ − × ÷) and a <b>TextView<\/b> for the result, arranged in a vertical <b>LinearLayout<\/b>.", "<b>Event handling<\/b>: each button gets a listener with <code>setOnClickListener()<\/code>; when tapped, Android calls its <code>onClick<\/code> (here a lambda <code>v -&gt; calc(op)<\/code>).", "Input is read with <code>getText().toString()<\/code> and converted using <code>Double.parseDouble()<\/code>.", "The operator decides the calculation: a + b, a − b, a × b or a ÷ b.", "Errors are handled: dividing by 0 shows \"Cannot divide by 0\"; empty input is caught by <code>try/catch<\/code> and shows \"Enter both numbers\".", "The answer is shown with <code>setText(\"Result: \" + r)<\/code>. No permission is needed."], "manifest_add": "(nothing to add - no permission needed)", "files": [{"name": "MainActivity.java", "lang": "java", "code": "package com.example.calculator;\n\nimport android.os.Bundle;\nimport android.widget.*;\nimport androidx.appcompat.app.AppCompatActivity;\n\npublic class MainActivity extends AppCompatActivity {\n    EditText n1, n2;\n    TextView res;\n\n    protected void onCreate(Bundle b) {\n        super.onCreate(b);\n        LinearLayout l = new LinearLayout(this);\n        l.setOrientation(LinearLayout.VERTICAL);\n        l.setPadding(50, 150, 50, 50);\n\n        n1 = new EditText(this); n1.setHint(\"Enter number 1\");\n        n2 = new EditText(this); n2.setHint(\"Enter number 2\");\n        res = new TextView(this); res.setTextSize(26);\n        l.addView(n1); l.addView(n2);\n\n        for (String op : new String[]{\"+\", \"-\", \"*\", \"/\"}) {\n            Button btn = new Button(this);\n            btn.setText(op);\n            btn.setOnClickListener(v -> calc(op));\n            l.addView(btn);\n        }\n        l.addView(res);\n        setContentView(l);\n    }\n\n    void calc(String op) {\n        try {\n            double a = Double.parseDouble(n1.getText().toString());\n            double b = Double.parseDouble(n2.getText().toString());\n            if (op.equals(\"/\") && b == 0) { res.setText(\"Cannot divide by 0\"); return; }\n            double r = op.equals(\"+\") ? a + b : op.equals(\"-\") ? a - b : op.equals(\"*\") ? a * b : a / b;\n            res.setText(\"Result: \" + r);\n        } catch (Exception e) {\n            res.setText(\"Enter both numbers\");\n        }\n    }\n}"}, {"name": "AndroidManifest.xml", "lang": "markup", "code": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <application\n        android:label=\"Calculator\"\n        android:theme=\"@style/Theme.AppCompat.Light.DarkActionBar\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            <\/intent-filter>\n        <\/activity>\n    <\/application>\n<\/manifest>"}], "run": ["Follow the common steps at the top (Empty Views Activity, Java).", "Paste MainActivity.java (keep your own <code>package<\/code> line).", "Add the manifest lines shown below.", "Run ▶ on the emulator."], "output": {"text": "Number 1 = 12, Number 2 = 4\n  +  →  Result: 16.0\n  -  →  Result: 8.0\n  *  →  Result: 48.0\n  /  →  Result: 3.0\n\nNumber 1 = 12, Number 2 = 0\n  /  →  Cannot divide by 0", "badge": "Tested on emulator"}}, {"id": "set7", "title": "Set 7 · Alarm Clock", "question": "Explain alarms in Android. How does AlarmManager schedule and notify? Write an alarm clock app.", "aim": "To build an Android alarm clock that lets the user pick a time and shows a message and plays a tone at that time.", "theory": ["<b>AlarmManager<\/b> is a system service that runs an action at a future time, even if the app is closed.", "The action is wrapped in a <b>PendingIntent<\/b> (here <code>getBroadcast()<\/code> for our receiver) so the system can fire it later on the app's behalf.", "<code>setExact(AlarmManager.RTC_WAKEUP, timeMillis, pi)<\/code> schedules it; RTC_WAKEUP uses wall-clock time and wakes the device. Other methods: <code>set()<\/code>, <code>setRepeating()<\/code>, <code>cancel()<\/code>.", "The time is taken from a <b>TimePicker<\/b> and put into a <code>Calendar<\/code>; if it is already past, one day is added.", "At alarm time the system sends the broadcast to <code>AlarmReceiver<\/code>; its <code>onReceive()<\/code> shows a Toast and plays the alarm ringtone using <code>RingtoneManager<\/code>.", "Manifest: <code>USE_EXACT_ALARM<\/code> permission (for exact alarms on Android 13+) and the <code>&lt;receiver&gt;<\/code> entry."], "manifest_add": "<!-- above <application> -->\n<uses-permission android:name=\"android.permission.USE_EXACT_ALARM\" />\n\n<!-- inside <application>, after <\/activity> -->\n<receiver android:name=\".MainActivity$AlarmReceiver\" />", "files": [{"name": "MainActivity.java", "lang": "java", "code": "package com.example.alarm;\n\nimport android.app.*;\nimport android.content.*;\nimport android.media.RingtoneManager;\nimport android.os.Bundle;\nimport android.widget.*;\nimport androidx.appcompat.app.AppCompatActivity;\nimport java.util.Calendar;\n\npublic class MainActivity extends AppCompatActivity {\n    protected void onCreate(Bundle b) {\n        super.onCreate(b);\n        LinearLayout l = new LinearLayout(this);\n        l.setOrientation(LinearLayout.VERTICAL);\n        TimePicker tp = new TimePicker(this);\n        Button set = new Button(this); set.setText(\"Set Alarm\");\n        l.addView(tp); l.addView(set);\n        setContentView(l);\n\n        set.setOnClickListener(v -> {\n            Calendar c = Calendar.getInstance();\n            c.set(Calendar.HOUR_OF_DAY, tp.getHour());\n            c.set(Calendar.MINUTE, tp.getMinute());\n            c.set(Calendar.SECOND, 0);\n            if (c.before(Calendar.getInstance())) c.add(Calendar.DATE, 1);\n\n            PendingIntent pi = PendingIntent.getBroadcast(this, 0,\n                    new Intent(this, AlarmReceiver.class), PendingIntent.FLAG_IMMUTABLE);\n            AlarmManager am = (AlarmManager) getSystemService(ALARM_SERVICE);\n            am.setExact(AlarmManager.RTC_WAKEUP, c.getTimeInMillis(), pi);\n            Toast.makeText(this, \"Alarm set for \" + tp.getHour() + \":\" + tp.getMinute(), Toast.LENGTH_SHORT).show();\n        });\n    }\n\n    public static class AlarmReceiver extends BroadcastReceiver {\n        public void onReceive(Context c, Intent i) {\n            Toast.makeText(c, \"Wake up! Alarm ringing\", Toast.LENGTH_LONG).show();\n            RingtoneManager.getRingtone(c, RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)).play();\n        }\n    }\n}"}, {"name": "AndroidManifest.xml", "lang": "markup", "code": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.USE_EXACT_ALARM\" />\n    <application\n        android:label=\"Alarm Clock\"\n        android:theme=\"@style/Theme.AppCompat.Light.DarkActionBar\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            <\/intent-filter>\n        <\/activity>\n        <receiver android:name=\".MainActivity$AlarmReceiver\" />\n    <\/application>\n<\/manifest>"}], "run": ["Follow the common steps at the top (Empty Views Activity, Java).", "Paste MainActivity.java (keep your own <code>package<\/code> line).", "Add the manifest lines shown below.", "Run ▶ on the emulator."], "output": {"text": "SET ALARM → toast \"Alarm set for HH:MM\"\nAt that time → toast \"Wake up! Alarm ringing\" and the alarm tone plays.", "badge": "Tested on emulator"}}]}, {"id": "dscc", "name": "DSCC", "full": "Distributed Systems & Cloud Computing", "intro": "Experiments 6–12: aim, program/commands, how to run and output.", "programs": [{"id": "exp06", "title": "Exp 6 · Two-Phase Commit", "aim": "To implement the Two-Phase Commit (2PC) protocol for coordinating a distributed transaction.", "run": ["Needs JDK 8+ (<code>java -version<\/code>).", "<code>javac TwoPhaseCommitDemo.java<\/code>", "<code>java TwoPhaseCommitDemo<\/code>"], "files": [{"name": "TwoPhaseCommitDemo.java", "lang": "java", "code": "public class TwoPhaseCommitDemo {\n    // Phase 1: each participant receives PREPARE and votes YES/NO\n    static boolean prepare(String node, boolean vote) {\n        System.out.println(node + \" received PREPARE, voted \" + (vote ? \"YES\" : \"NO\"));\n        return vote;\n    }\n\n    // Coordinator: commit only if every participant voted YES\n    static void transaction(String[] nodes, boolean[] votes) {\n        System.out.println(\"--- Phase 1: Prepare ---\");\n        boolean allYes = true;\n        for (int i = 0; i < nodes.length; i++)\n            allYes &= prepare(nodes[i], votes[i]);\n        System.out.println(\"--- Phase 2: \" + (allYes ? \"Commit\" : \"Rollback\") + \" ---\");\n        for (String n : nodes)\n            System.out.println(n + (allYes ? \" COMMITTED\" : \" ROLLED BACK\"));\n    }\n\n    public static void main(String[] args) {\n        String[] nodes = {\"Node1\", \"Node2\", \"Node3\"};\n        System.out.println(\"Transaction 1:\");\n        transaction(nodes, new boolean[]{true, true, true});\n        System.out.println(\"\\nTransaction 2:\");\n        transaction(nodes, new boolean[]{true, false, true});\n    }\n}"}], "output": {"text": "Transaction 1:\n--- Phase 1: Prepare ---\nNode1 received PREPARE, voted YES\nNode2 received PREPARE, voted YES\nNode3 received PREPARE, voted YES\n--- Phase 2: Commit ---\nNode1 COMMITTED\nNode2 COMMITTED\nNode3 COMMITTED\n\nTransaction 2:\n--- Phase 1: Prepare ---\nNode1 received PREPARE, voted YES\nNode2 received PREPARE, voted NO\nNode3 received PREPARE, voted YES\n--- Phase 2: Rollback ---\nNode1 ROLLED BACK\nNode2 ROLLED BACK\nNode3 ROLLED BACK", "badge": "Ran un": ["Create a Google Cloud project (billing / free trial enabled) and note its <b>Project ID<\/b>.", "Install the Google Cloud SDK, or simply open <b>Cloud Shell<\/b> in the console (gcloud is ready there).", "Run the commands in bigtable.sh one by one (replace YOUR_PROJECT_ID).", "Delete the instance after the lab: <code>gcloud bigtable instances delete my-instance<\/code>"], "files": [{"name": "bigtable.sh", "lang": "bash", "code": "# 1. Select project and enable the Bigtable API\ngcloud init\ngcloud config set project YOUR_PROJECT_ID\ngcloud services enable bigtable.googleapis.com\n\n# 2. Create an instance (1 node cluster)\ngcloud bigtable instances create my-instance --display-name=\"My Instance\" \\\n  --cluster-config=id=my-cluster,zone=asia-south1-a,nodes=1\n\n# 3. Install cbt and save defaults in ~/.cbtrc (so -project/-instance are not repeated)\ngcloud components install cbt\necho \"project = YOUR_PROJECT_ID\" > ~/.cbtrc\necho \"instance = my-instance\" >> ~/.cbtrc\n\n# 4. Create table + column family, insert, read, delete\ncbt createtable my-table\ncbt createfamily my-table cf1\ncbt set my-table row1 cf1:name=Alice cf1:age=25 cf1:dept=CSE\ncbt read my-table\ncbt deleterow my-table row1\ncbt deletetable my-table"}], "output": {"text": "$ cbt read my-table\n----------------------------------------\nrow1\n  cf1:age                                  @ 2026/11/20-10:20:15.123000\n    \"25\"\n  cf1:dept                                 @ 2026/11/20-10:20:15.123000\n    \"CSE\"\n  cf1:name                                 @ 2026/11/20-10:20:15.123000\n    \"Alice\"\n\n$ cbt deleterow my-table row1\n$ cbt read my-table\n(no rows printed - table is empty)", "badge": "Expected (cloud step, not run here)"}}]}, {"id": "dl", "name": "DL", "full": "Deep Learning", "intro": "Keras programs: CNN, RNN, LSTM and GAN. Each runs in under a minute on a CPU.", "programs": [{"id": "cnn", "title": "CNN · MNIST Digits", "aim": "To build a Convolutional Neural Network in Keras that classifies handwritten digits (MNIST).", "files": [{"name": "cnn.py", "lang": "python", "code": "# CNN: classify handwritten digits (MNIST)\nfrom tensorflow import keras\nfrom tensorflow.keras import layers\n\n(x_train, y_train), (x_test, y_test) = keras.datasets.mnist.load_data()\nx_train = x_train.reshape(-1, 28, 28, 1) / 255.0\nx_test = x_test.reshape(-1, 28, 28, 1) / 255.0\n\nmodel = keras.Sequential([\n    keras.Input(shape=(28, 28, 1)),\n    layers.Conv2D(32, 3, activation=\"relu\"),\n    layers.MaxPooling2D(),\n    layers.Conv2D(64, 3, activation=\"relu\"),\n    layers.MaxPooling2D(),\n    layers.Flatten(),\n    layers.Dense(64, activation=\"relu\"),\n    layers.Dense(10, activation=\"softmax\"),\n])\nmodel.compile(optimizer=\"adam\", loss=\"sparse_categorical_crossentropy\",\n              metrics=[\"accuracy\"])\nmodel.summary()\nmodel.fit(x_train, y_train, epochs=2, batch_size=128, validation_split=0.1, verbose=2)\n\nloss, acc = model.evaluate(x_test, y_test, verbose=0)\nprint(\"Test accuracy:\", round(acc, 4))\npred = model.predict(x_test[:5], verbose=0).argmax(axis=1)\nprint(\"Predicted:\", pred, \"Actual:\", y_test[:5])"}], "run": ["Install Python 3.10+, then <code>pip install tensorflow<\/code>.", "<code>python cnn.py<\/code> (takes under a minute on a laptop CPU).", "First run downloads the dataset automatically (internet needed)."], "output": {"text": "Model: \"sequential\"\n┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┳━━━━━━━━━━━━━━━━━━━━━━━━┳━━━━━━━━━━━━━━━┓\n┃ Layer (type)                    ┃ Output Shape           ┃       Param # ┃\n┡━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━╇━━━━━━━━━━━━━━━━━━━━━━━━╇━━━━━━━━━━━━━━━┩\n│ conv2d (Conv2D)                 │ (None, 26, 26, 32)     │           320 │\n├─────────────────────────────────┼────────────────────────┼───────────────┤\n│ max_pooling2d (MaxPooling2D)    │ (None, 13, 13, 32)     │             0 │\n├─────────────────────────────────┼────────────────────────┼───────────────┤\n│ conv2d_1 (Conv2D)               │ (No tropy\", metrics=[\"accuracy\"])\nmodel.summary()\nmodel.fit(x_train, y_train, epochs=3, batch_size=64, validation_split=0.2, verbose=2)\n\nloss, acc = model.evaluate(x_test, y_test, verbose=0)\nprint(\"Test accuracy:\", round(acc, 4))\np = model.predict(x_test[:5], verbose=0).ravel()\nprint(\"Predicted:\", (p > 0.5).astype(int), \"Actual:\", y_test[:5])"}], "run": ["Install Python 3.10+, then <code>pip install tensorflow<\/code>.", "<code>python rnn.py<\/code> (takes under a minute on a laptop CPU).", "First run downloads the dataset automatically (internet needed)."], "output": {"text": "Model: \"sequential\"\n┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┳━━━━━━━━━━━━━━━━━━━━━━━━┳━━━━━━━━━━━━━━━┓\n┃ Layer (type)                    ┃ Output Shape           ┃       Param # ┃\n┡━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━╇━━━━━━━━━━━━━━━━━━━━━━━━╇━━━━━━━━━━━━━━━┩\n│ embedding (Embedding)           │ (None, 200, 32)        │       320,000 │\n├─────────────────────────────────┼────────────────────────┼───────────────┤\n│ simple_rnn (SimpleRNN)          │ (None, 32)             │         2,080 │\n├─────────────────────────────────┼────────────────────────┼───────────────┤\n│ dense (Dense)                   │ (None, 1)              │            33 │\n└─────────────────────────────────┴────────────────────────┴───────────────┘\n Total params: 322,113 (1.23 MB)\n Trainable params: 322,113 (1.23 MB)\n Non-trainable params: 0 (0.00 B)\nEpoch 1/3\n313/313 - 5s - 17ms/step - accuracy: 0.6750 - loss: 0.5788 - val_accuracy: 0.7656 - val_loss: 0.4866\nEpoch 2/3\n313/313 - 4s - 14ms/step - accuracy: 0.8288 - loss: 0.3938 - val_accuracy: 0.8290 - val_loss: 0.4017\nEpoch 3/3\n313/313 - 5s - 14ms/step - accuracy: 0.9079 - loss: 0.2362 - val_accuracy: 0.8312 - val_loss: 0.4129\nTest accuracy: 0.8328\nPredicted: [0 1 1 1 1] Actual: [0 1 1 0 1]", "badge": "Ran locally (TensorFlow 2.21, CPU)"}}, {"id": "lstm", "title": "LSTM · IMDB Sentiment", "aim": "To build a Long Short-Term Memory (LSTM) network in Keras for IMDB movie review sentiment classification.", "files": [{"name": "lstm.py", "lang": "python", "code": "# LSTM: movie review sentiment (IMDB)\nfrom tensorflow import keras\nfrom tensorflow.keras import layers\n\nwords, maxlen = 10000, 200\n(x_train, y_train), (x_test, y_test) = keras.datasets.imdb.load_data(num_words=words)\nx_train = keras.utils.pad_sequences(x_train, maxlen=maxlen)\nx_test = keras.utils.pad_sequences(x_test, maxlen=maxlen)\n\nmodel = keras.Sequential([\n    keras.Input(shape=(maxlen,)),\n    layers.Embedding(words, 32),\n    layers.LSTM(32),\n    layers.Dense(1, activation=\"sigmoid\"),\n])\nmodel.compile(optimizer=\"adam\", loss=\"binary_crossentropy\", metrics=[\"accuracy\"])\nmodel.summary()\nmodel.fit(x_train, y_train, epochs=2, batch_size=128, validation_split=0.2, verbose=2)\n\nloss, acc = model.evaluate(x_test, y_test, verbose=0)\nprint(\"Test accuracy:\", round(acc, 4))\np = model.predict(x_test[:5], verbose=0).ravel()\nprint(\"Predicted:\", (p > 0.5).astype(int), \"Actual:\", y_test[:5])"}], "run": ["Install Python 3.10+, then <code>pip install tensorflow<\/code>.", "<code>python lstm.py<\/code> (takes under a minute on a laptop CPU).", "First run downloads the dataset automatically (internet needed)."], "output": {"text": "Model: \"sequential\"\n┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┳━━━━━━━━━━━━━━━━━━━━━━━━┳━━━━━━━━━━━━━━━┓\n┃ Layer (type)                    ┃ Output Shape           ┃       Param # ┃\n┡━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━╇━━━━━━━━━━━━━━━━━━━━━━━━╇━━━━━━━━━━━━━━━┩\n│ embedding (Embedding)           │ (None, 200, 32)        │       320,000 │\n├─────────────────────────────────┼────────────────────────┼───────────────┤\n│ lstm (LSTM)                     │ (None, 32)             │         8,320 │\n├─────────────────────────────────┼────────────────────────┼───────────────┤\n│ dense (Dense)                   │ (None, 1)              │            33 │\n└─────────────────────────────────┴────────────────────────┴───────────────┘\n Total params: 328,353 (1.25 MB)\n Trainable params: 328,353 (1.25 MB)\n Non-trainable params: 0 (0.00 B)\nEpoch 1/2\n157/157 - 9s - 56ms/step - accuracy: 0.7515 - loss: 0.4991 - val_accuracy: 0.8454 - val_loss: 0.3710\nEpoch 2/2\n157/157 - 8s - 51ms/step - accuracy: 0.8930 - loss: 0.2662 - val_accuracy: 0.8746 - val_loss: 0.3072\nTest accuracy: 0.8701\nPredicted: [0 1 1 1 1] Actual: [0 1 1 0 1]", "badge": "Ran locally (TensorFlow 2.21, CPU)"}}, {"id": "gan", "title": "GAN · Generate MNIST Digits", "aim": "To build a simple Generative Adversarial Network in Keras that generates handwritten-digit images from random noise.", "files": [{"name": "gan.py", "lang": "python", "code": "# GAN: generate handwritten digits (MNIST) with dense layers\nimport numpy as np\nfrom tensorflow import keras\nfrom tensorflow.keras import layers\n\n(x, _), _ = keras.datasets.mnist.load_data()\nx = (x[:10000].reshape(-1, 784) / 127.5 - 1).astype(\"float32\")  # scale to [-1, 1]\nnoise_dim, batch = 64, 128\n\nG = keras.Sequential([keras.Input(shape=(noise_dim,)),\n    layers.Dense(128, activation=\"relu\"), layers.Dense(784, activation=\"tanh\")])\nD = keras.Sequential([keras.Input(shape=(784,)),\n    layers.Dense(128, activation=\"relu\"), layers.Dense(1, activation=\"sigmoid\")])\nD.compile(optimizer=\"adam\", loss=\"binary_crossentropy\", metrics=[\"accuracy\"])\n\ngan = keras.Sequential([G, D])\ngan.compile(optimizer=\"adam\", loss=\"binary_crossentropy\")\n\nfor step in range(1, 5001):\n    D.trainable = True                       # 1) train discriminator\n    real = x[np.random.randint(0, len(x), batch)]\n    fake = G(np.random.normal(size=(batch, noise_dim))).numpy()\n    d_loss, d_acc = D.train_on_batch(np.vstack([real, fake]),\n                                     np.vstack([np.ones((batch, 1)), np.zeros((batch, 1))]))\n    D.trainable = False                      # 2) train generator through frozen D\n    g_loss = gan.train_on_batch(np.random.normal(size=(batch, noise_dim)), np.ones((batch, 1)))\n    if step % 1000 == 0:\n        print(f\"Step {step}: D loss={d_loss:.3f} D acc={d_acc:.2f} G loss={g_loss:.3f}\")\n\nimg = G.predict(np.random.normal(size=(1, noise_dim)), verbose=0).reshape(28, 28)\nfor row in img[::2]:                         # print generated digit as text art\n    print(\"\".join(\"#\" if v > 0 else \".\" for v in row))"}], "run": ["Install Python 3.10+, then <code>pip install tensorflow<\/code>.", "<code>python gan.py<\/code> (takes under a minute on a laptop CPU).", "First run downloads the dataset automatically (internet needed)."], "output": {"text": "Step 1000: D loss=0.068 D acc=0.98 G loss=4.097\nStep 2000: D loss=0.783 D acc=0.65 G loss=1.501\nStep 3000: D loss=0.877 D acc=0.51 G loss=0.884\nStep 4000: D loss=0.842 D acc=0.70 G loss=4.060\nStep 5000: D loss=0.647 D acc=0.76 G loss=3.670\n............................\n............................\n..............#.............\n............####...#........\n.........#....#...#.#.......\n.........###....###.........\n........##.##.###.#.#...#...\n........#...#..#.#..#.......\n.......#.#.#.##..#..........\n.......#...#.#....##..#.....\n.......#..##...#.#..#.......\n......#.##.#..##............\n............#...............\n............................", "badge": "Ran locally (TensorFlow 2.21, CPU)"}}]}]</script>
